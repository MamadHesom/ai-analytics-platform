name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }} quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            python-backend/requirements.txt
            ml-module/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python-backend/requirements.txt -r ml-module/requirements.txt

      - name: Lint
        run: ruff check python-backend ml-module

      - name: Check formatting
        run: ruff format --check python-backend ml-module

      - name: Compile Python sources
        run: python -m compileall -q python-backend/app ml-module

      - name: Run tests
        env:
          ENVIRONMENT: test
          LOG_LEVEL: WARNING
        run: pytest -q python-backend/tests

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["python-backend", "ml-module"]
testpaths = ["python-backend/tests"]
addopts = "--strict-markers --disable-warnings"

[tool.coverage.run]
source = ["python-backend/app"]
branch = true
